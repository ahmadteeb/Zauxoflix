name: zauxoflix
version: 0.1.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-zauxoflix: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.zauxoflix # adjust accordingly to your app name

apps:
  zauxoflix:
    command: zauxoflix
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-zauxoflix
parts:
  zauxoflix:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
