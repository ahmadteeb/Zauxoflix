<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zauxoflix Trailers</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #08080c; color: #fafafa; font: 600 27px system-ui,sans-serif }
    header { height: 10vh; display: flex; align-items: center; gap: 24px; padding: 0 3vw }
    h1 { font-size: 1em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1 }
    button { background: #24242c; color: white; border: 0; padding: 12px 22px; border-radius: 2em; font: inherit; cursor: pointer }
    button:focus { background: white; color: #111; outline: 3px solid white; outline-offset: 4px }
    iframe { width: 100vw; height: 90vh; border: 0; display: block }
    p { text-align: center; margin-top: 32vh }
    [hidden] { display: none }
  </style>
</head>
<body>
  <header>
    <button id="back">‹ Back</button><h1>Trailer</h1>
    <button id="toggle">Play trailer</button><button id="external" hidden>Open in YouTube</button>
  </header>
  <p role="status">Loading trailer…</p>
  <iframe hidden tabindex="-1" title="Trailer player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  <script>
    const app = 'com.flutter.app.zauxoflix';
    const frame = document.querySelector('iframe');
    const status = document.querySelector('p');
    const back = document.querySelector('#back');
    const toggle = document.querySelector('#toggle');
    const external = document.querySelector('#external');
    const requests = new Set();
    let video, origin, launchNumber = 0, hostFailed = false;
    function call(uri, params) {
      return new Promise((resolve, reject) => {
        const bridge = new PalmServiceBridge();
        requests.add(bridge);
        bridge.onservicecallback = data => {
          requests.delete(bridge);
          try {
            const result = JSON.parse(data);
            if (result.returnValue) resolve(result);
            else reject(new Error(result.errorText));
          } catch (e) { reject(e); }
        };
        bridge.call(uri, JSON.stringify(params));
      });
    }
    function launchApp(id, params) {
      return call('luna://com.webos.applicationManager/launch', {id, params});
    }
    function closeTrailer() {
      frame.removeAttribute('src');
      launchApp(app, {}).then(() => window.close(), () => window.close());
    }
    function error(text) {
      hostFailed = true;
      frame.hidden = true;
      status.textContent = text;
      status.hidden = false;
      toggle.textContent = 'Retry';
      external.hidden = !video;
    }
    async function load(params) {
      const sequence = ++launchNumber;
      hostFailed = false;
      video = /^[A-Za-z0-9_-]{11}$/.test(params.video || '') ? params.video : '';
      document.querySelector('h1').textContent = params.title ? params.title + ' · Trailer' : 'Trailer';
      if (!video) return error('Choose a trailer from a movie or series in Zauxoflix.');
      toggle.textContent = 'Play trailer';
      external.hidden = true;
      toggle.focus();
      try {
        const response = await call('luna://com.flutter.app.zauxoflix.trailer.host/start', {});
        if (sequence !== launchNumber) return;
        if (!Number.isInteger(response.port) || response.port < 1 || response.port > 65535) throw Error();
        origin = 'http://127.0.0.1:' + response.port;
        frame.src = origin + '/player#v=' + video;
        frame.hidden = false;
        status.hidden = true;
      } catch (e) {
        if (sequence === launchNumber) error('The trailer player could not start.');
      }
    }
    function parameters() {
      try { return JSON.parse((window.webOSSystem || window.PalmSystem).launchParams || '{}'); }
      catch (_) { return {}; }
    }
    document.addEventListener('webOSRelaunch', event => load(event.detail || parameters()));
    back.onclick = closeTrailer;
    toggle.onclick = () => {
      if (hostFailed) load(parameters());
      else if (origin) frame.contentWindow.postMessage('toggleTrailer', origin);
    };
    external.onclick = () => launchApp('com.webos.app.browser', {target: 'https://www.youtube.com/watch?v=' + video})
      .catch(() => { status.textContent = 'YouTube could not open.'; status.hidden = false; });
    window.addEventListener('message', e => {
      if (e.source !== frame.contentWindow || e.origin !== origin || !e.data) return;
      const state = e.data.trailerState;
      toggle.textContent = state === 'playing' ? 'Pause trailer' : state === 'error' ? 'Retry' : 'Play trailer';
      external.hidden = state !== 'error';
    });
    window.addEventListener('keydown', e => {
      if ([461, 27, 8].includes(e.keyCode)) { e.preventDefault(); closeTrailer(); return; }
      if (e.keyCode === 13 && document.activeElement.tagName === 'BUTTON') {
        e.preventDefault();
        if (!e.repeat) document.activeElement.click();
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        const buttons = Array.from(document.querySelectorAll('button:not([hidden])'));
        const index = buttons.indexOf(document.activeElement);
        buttons[Math.max(0, Math.min(buttons.length - 1, index + (e.key === 'ArrowLeft' ? -1 : 1)))].focus();
      }
    });
    load(parameters());
  </script>
</body>
</html>
